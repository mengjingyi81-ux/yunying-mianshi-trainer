<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营面试刷题训练器</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#718096;--line:#e7eaf1;--blue:#315efb;--blue2:#edf1ff;--green:#19a974;--orange:#f59e0b;--red:#e05252}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:600;color:var(--ink);background:#eef0f5}button.primary{background:var(--blue);color:#fff}.app{display:flex;min-height:100vh}.side{width:235px;background:#101a33;color:#dce4ff;padding:24px 16px}.brand{font-size:20px;font-weight:800;margin:0 10px 26px}.brand small{display:block;color:#8997bd;font-size:11px;font-weight:400;margin-top:3px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#aeb9d8;margin:5px 0}.nav button.active,.nav button:hover{background:#26345b;color:#fff}.main{flex:1;padding:26px;max-width:1350px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title{font-size:25px;font-weight:800}.sub{color:var(--muted)}.view{display:none}.view.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 18px #24345b08}.stat{font-size:28px;font-weight:800;margin-top:4px}.label{color:var(--muted);font-size:12px}.bar{height:8px;background:#edf0f5;border-radius:10px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--blue);border-radius:10px}.section{margin:22px 0 12px;font-size:16px;font-weight:800}.hero{background:linear-gradient(120deg,#eef2ff,#fff);display:flex;justify-content:space-between;align-items:center}.hero h2{margin:0 0 6px;font-size:22px}.qcard{max-width:900px;margin:auto}.tag{display:inline-block;background:var(--blue2);color:var(--blue);padding:4px 9px;border-radius:20px;font-size:12px;margin-right:6px}.q{font-size:21px;font-weight:800;margin:20px 0}.limit{color:var(--orange);background:#fff7e5;padding:10px 12px;border-radius:9px}.answer{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;padding:14px;resize:vertical;font:inherit;outline:0;margin:16px 0}.answer:focus{border-color:var(--blue)}.actions{display:flex;justify-content:space-between}.score{font-size:38px;font-weight:800;color:var(--blue)}.eval{border-left:3px solid var(--blue);padding-left:14px;margin:12px 0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:5px 9px;background:#f2f4f8;border-radius:8px;font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);padding:40px}.kb{display:grid;grid-template-columns:220px 1fr;gap:16px}.kbmenu button{width:100%;text-align:left;background:#fff;margin-bottom:6px}.kbmenu button.sel{color:var(--blue);background:var(--blue2)}.formula{background:#f8f9fc;padding:14px;border-radius:10px;color:#35415a}.pill{float:right;color:var(--muted);font-size:12px}@media(max-width:800px){.side{width:68px}.brand{font-size:0}.brand small,.nav span{display:none}.main{padding:16px}.grid{grid-template-columns:1fr}.kb{grid-template-columns:1fr}.q{font-size:18px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">运营刷题<span>◇</span><small>面试情境训练系统</small></div><nav class="nav"><button class="active" data-v="home">⌂ <span>训练首页</span></button><button data-v="quiz">◉ <span>开始刷题</span></button><button data-v="records">▤ <span>训练记录</span></button><button data-v="knowledge">▦ <span>知识库</span></button></nav></aside><main class="main"><div class="top"><div><div class="title" id="viewTitle">训练首页</div><div class="sub">把每一次回答，变成下一次面试的底气</div></div><button onclick="start()" class="primary">随机抽 3 题</button></div>
<section id="home" class="view on"><div class="card hero"><div><h2>今天练一轮？</h2><div class="sub">每轮 3 题 · 逐题作答 · 自动复盘</div></div><button class="primary" onclick="start()">开始训练 →</button></div><div class="section">训练概览</div><div class="grid"><div class="card"><div class="label">累计答题</div><div class="stat" id="statCount">0</div><div class="sub">道情境题</div></div><div class="card"><div class="label">平均总分</div><div class="stat" id="statScore">—</div><div class="sub">满分 100</div></div><div class="card"><div class="label">连续训练</div><div class="stat" id="statDays">0</div><div class="sub">天</div></div></div><div class="section">能力雷达概览</div><div class="card" id="miniRadar"></div><div class="section">最近训练</div><div class="card" id="recent"></div></section>
<section id="quiz" class="view"><div id="quizArea"></div></section><section id="records" class="view"><div class="card"><div class="section" style="margin-top:0">训练记录 <span class="pill" id="recordCount"></span></div><div id="recordsArea"></div></div></section><section id="knowledge" class="view"><div class="kb"><div class="kbmenu" id="kbMenu"></div><div class="card" id="kbContent"></div></div></section></main></div>
<script>
const cats=[['指标提升','定义指标 → 量化缺口 → 指标拆解 → 用户分层 → 原因分析 → 策略设计 → 实验验证',['北极星指标与过程指标','人群/场景/渠道拆解','增量与基线对照'],['提升司机在线时长','提高用户发帖率','提升商家开播频次','提高订单量','提升功能使用率'] ],['转化优化','拆漏斗 → 找最大流失点 → 分析用户阻力 → 优化关键节点 → A/B测试',['漏斗转化率','分步转化','流失原因与承接效率'],['注册转化率低怎么办','详情页下单率如何提升','优惠券领取后不核销怎么办','活动曝光多但参与率低','直播间观看多但购买少']],['活跃留存召回','用户分层 → 找流失节点 → 分析核心价值 → 建立习惯 → 召回验证',['次日/7日/30日留存','激活率与频次','召回率与回流质量'],['如何提升新用户次日留存','用户注册后只用一次怎么办','如何提升月活','如何召回流失用户','有需求但使用频次低怎么办']],['异常诊断','确认口径 → 判断范围 → 时间/渠道/人群/版本拆分 → 假设验证 → 修复复盘',['环比/同比与基线','影响面与损失估算','止损指标'],['订单量突然下降30%怎么排查','活动上线效果差怎么办','投诉量突然上升怎么处理','渠道新增骤降如何分析','新功能数据低于预期怎么定位']],['供需匹配','需求规模 → 供给规模 → 时空错配 → 匹配效率 → 激励调度 → 双边验证',['供给覆盖率','等待/履约时长','供需平衡与补贴效率'],['晚高峰司机不足怎么办','商家多但用户无合适商品怎么办','订单多但骑手不足怎么办','职位多但投递少怎么办','如何提升主播观众匹配']],['方案策划','目标 → 用户 → 场景 → 核心行为 → 机制 → 路径 → 资源 → 指标 → 风险',['目标行为与参与门槛','传播链路','成本、风险、复盘'],['策划一次拉新活动','设计创作者活跃活动','为新功能制定运营方案','设计节日营销活动','设计内容专题']],['冷启动','定义种子 → 供给准备 → 首批用户 → 反馈迭代 → 扩大规模',['种子用户质量','供给丰富度','激活与留存'],['新社区如何冷启动','新城市业务如何起量','新内容频道如何启动','新工具没有用户怎么办','如何启动一个达人池']],['增长实验','提出假设 → 选择变量 → 设计对照 → 设定样本与周期 → 分析决策',['实验组/对照组','显著性与置信区间','短期指标与长期副作用'],['如何设计一次增长实验','优惠券是否有效怎么验证','Push频次怎么找最优','首页改版如何评估','如何判断增长是否可持续']],['用户研究','目标 → 样本 → 访谈/问卷 → 归因 → 洞察 → 优先级',['代表性与偏差','用户原话到行为证据','机会优先级'],['如何研究用户流失','投诉很多但数据不明显怎么办','如何识别真实需求','用户说喜欢但不使用怎么办','如何做一次满意度调研']],['商业化ROI','目标收入 → 流量/转化/客单拆解 → 成本 → 增量归因 → ROI复盘',['收入、毛利与贡献利润','CAC/LTV','ROI与边际收益'],['投放ROI下降怎么办','设计一套付费会员方案','如何评估商业化活动','广告位影响体验怎么办','如何提升客单价']],['跨部门协作','对齐目标 → 明确角色 → 拆里程碑 → 风险同步 → 结果复盘',['RACI与关键路径','事实/判断/建议','冲突解决'],['产品不排期你的需求怎么办','如何推动研发按期上线','销售与运营目标冲突怎么办','资源不足如何取舍','如何向老板汇报坏消息']],['内容运营','定位 → 供给 → 分发 → 互动 → 质量治理 → 复盘',['内容供给量与有效率','消费时长/互动率','生态健康与风险'],['如何提升内容投稿量','爆款内容如何复制','低质内容太多怎么办','如何搭建内容栏目','热点事件如何运营']]];
let questions=cats.flatMap((c,ci)=>c[3].map((q,i)=>({id:ci*5+i+1,cat:c[0],q:q+'？',formula:c[1],knowledge:c[2],pressure:['预算减半，目标不变','只能使用站内资源','一周内必须看到结果'][i%3]})));
const keys=['目标拆解','用户洞察','策略设计','数据分析','实验验证','表达结构','风险意识'];let records=JSON.parse(localStorage.opsRecords||'[]'), round=[], idx=0;
function $(id){return document.getElementById(id)} function save(){localStorage.opsRecords=JSON.stringify(records)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(v).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));$('viewTitle').textContent={home:'训练首页',quiz:'进行中的训练',records:'训练记录',knowledge:'运营知识库'}[v];if(v==='records')renderRecords();if(v==='knowledge')renderKB();if(v==='home')renderHome()}
function start(){round=[...questions].sort(()=>Math.random()-.5).slice(0,3);idx=0;show('quiz');renderQuestion()}
function renderQuestion(){let x=round[idx];$('quizArea').innerHTML=`<div class="card qcard"><div><span class="tag">第 ${idx+1}/3 题</span><span class="tag">${x.cat}</span></div><div class="q">${x.q}</div><div class="limit">加压条件：${x.pressure}</div><textarea id="ans" class="answer" placeholder="建议先用 30 秒说清目标、拆解和优先策略，再补充验证方式……"></textarea><div class="actions"><span class="sub">可先列框架，再展开关键判断</span><button class="primary" onclick="submitAnswer()">提交并评价 →</button></div></div>`}
function evaluate(a,x){let len=a.trim().length, has=['目标','指标','用户','分层','原因','策略','验证','实验','风险','数据'].filter(k=>a.includes(k)).length;let total=Math.min(96,Math.max(35,Math.round(35+len/18+has*5)));let weak=keys.filter((_,i)=>!a.includes(['目标','用户','策略','数据','验证','结构','风险'][i])).slice(0,3);return {total,weak,advice:len<100?'先用一句话定义目标，再按“指标—人群—原因—策略—验证”展开。':weak.length?'补足'+weak.join('、')+'，并明确优先级、周期和护栏指标。':'已形成较完整闭环，可进一步加入反例、资源约束和量化预期。'}}
function submitAnswer(){let a=$('ans').value,x=round[idx],e=evaluate(a,x);records.unshift({date:new Date().toLocaleString('zh-CN',{hour12:false}),q:x.q,cat:x.cat,answer:a,score:e.total,weak:e.weak.join('、')||'暂无明显卡点',advice:e.advice,formula:x.formula});save();$('quizArea').innerHTML=`<div class="card qcard"><span class="tag">${x.cat}</span><div class="score">${e.total}<small>/100</small></div><div class="sub">本题结构化评价</div><div class="eval"><b>主要卡点：</b>${e.weak.join('、')||'整体结构完整'}</div><div class="eval"><b>改进建议：</b>${e.advice}</div><div class="section">参考拆解</div><div class="formula">${x.formula}</div><div class="section">运营知识提醒</div><div class="chips">${x.knowledge.map(k=>`<span class="chip">${k}</span>`).join('')}</div><div class="section">更优回答框架</div><p>先定义目标与口径；再按人群、场景、渠道拆解；找到最大机会点后给出分层策略；最后说明实验、周期、预期和护栏指标。</p><button class="primary" onclick="next()">${idx<2?'下一题 →':'完成本轮复盘 →'}</button></div>`}
function next(){if(idx<2){idx++;renderQuestion()}else{show('records');alert('本轮完成！已生成 3 条训练记录。')}}
function renderHome(){let n=records.length,avg=n?Math.round(records.reduce((s,r)=>s+r.score,0)/n):0;$('statCount').textContent=n;$('statScore').textContent=n?avg:'—';$('statDays').textContent=new Set(records.map(r=>r.date.slice(0,10))).size;$('miniRadar').innerHTML=keys.map((k,i)=>{let v=n?Math.min(95,50+records.filter(r=>!r.weak.includes(k)).length*8):0;return `<div style="margin:9px 0"><span>${k}</span><span class="pill">${v||'—'}</span><div class="bar"><i style="width:${v}%"></i></div></div>`}).join('');$('recent').innerHTML=n?`<table class="table"><tr><th>日期</th><th>题目</th><th>得分</th></tr>${records.slice(0,5).map(r=>`<tr><td>${r.date}</td><td>${r.q}</td><td>${r.score}</td></tr>`).join('')}</table>`:'<div class="empty">还没有训练记录，开始第一轮吧。</div>'}
function renderRecords(){ $('recordCount').textContent=records.length+' 条';$('recordsArea').innerHTML=records.length?`<table class="table"><tr><th>日期</th><th>题型 / 题目</th><th>回答</th><th>评分</th><th>卡点与建议</th></tr>${records.map(r=>`<tr><td>${r.date}</td><td><span class="tag">${r.cat}</span><br>${r.q}</td><td>${(r.answer||'').slice(0,90)}${(r.answer||'').length>90?'…':''}</td><td><b>${r.score}</b></td><td>${r.weak}<br><span class="sub">${r.advice}</span></td></tr>`).join('')}</table>`:'<div class="empty">完成题目后，记录会自动出现在这里。</div>'}
function renderKB(){let menu=cats.map((c,i)=>`<button class="${i===0?'sel':''}" onclick="kb(${i},this)">${c[0]} <span class="pill">5题</span></button>`).join('');$('kbMenu').innerHTML=`<button class="sel" onclick="kb(0,this)">总览 <span class="pill">60题</span></button>`+menu;$('kbContent').innerHTML=`<h2>运营面试知识库</h2><p class="sub">沉淀题型公式、分层方法、指标与护栏，答题时可随时回看。</p><div class="formula">通用回答主线：定义目标 → 指标拆解 → 用户分层 → 原因假设 → 策略优先级 → 实验验证 → 风险护栏</div><div class="section">七项评分维度</div><div class="chips">${keys.map(k=>`<span class="chip">${k}</span>`).join('')}</div>`}function kb(i,el){document.querySelectorAll('.kbmenu button').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');let c=cats[i];$('kbContent').innerHTML=`<span class="tag">${c[0]}</span><h2>${c[1]}</h2><div class="section">关键指标与知识</div><div class="chips">${c[2].map(k=>`<span class="chip">${k}</span>`).join('')}</div><div class="section">题目清单</div><ol>${c[3].map(q=>`<li>${q}？</li>`).join('')}</ol><div class="section">答题提醒</div><p>不要堆砌玩法。先讲判断依据，再讲策略；至少说清一个核心指标、一个护栏指标和验证周期。</p>`)}renderHome();
</script></body></html>
